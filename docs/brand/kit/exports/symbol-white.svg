<svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title"><title>StokvelOS logo</title>
  <title id="title">StokvelOS symbol</title>
  <g id="symbol" fill="#ffffff">
    <!-- Three ruled ledger lines (expanded strokes, rounded caps) -->
    <rect x="24" y="72" width="208" height="16" rx="8"/>
    <rect x="24" y="120" width="208" height="16" rx="8"/>
    <rect x="24" y="168" width="208" height="16" rx="8"/>
    <!-- Highlighted payout column -->
    <rect x="168" y="64" width="24" height="128" rx="4"/>
    <!-- Subtle inward cycle arc (expanded stroke, flat caps) -->
    <path d="M 224 76 A 52 52 0 0 0 224 180 L 224 172 A 44 44 0 0 1 224 84 Z"/>
  </g>
</svg>